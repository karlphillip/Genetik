[build-system]
requires = ["scikit-build-core==0.10.7", "pybind11==2.13.6"]
build-backend = "scikit_build_core.build"

[project]
name = "genetik"
version = "0.7.0"
description = "C++20 genetic algorithms with optional symbolic-regression bindings"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Karl Phillip Buhr" }]
dependencies = ["numpy>=1.20", "scikit-learn>=1.0", "sympy>=1.9"]

[tool.scikit-build]
minimum-version = "0.10"
wheel.packages = ["python/genetik"]
cmake.build-type = "Release"
cmake.args = [
  "-DGENETIK_BUILD_PYTHON=ON",
  "-DGENETIK_BUILD_TESTS=OFF",
  "-DGENETIK_BUILD_EXAMPLES=OFF",
  "-DGENETIK_INSTALL=OFF",
  "-DGENETIK_WARNINGS_AS_ERRORS=ON",
]
sdist.include = [
  "/CMakeLists.txt",
  "/cmake/**",
  "/genetik/**",
  "/python/**",
  "/LICENSE",
  "/README.md",
  "/CHANGELOG.md",
  "/docs/I1_PYTHON_INTEROPERABILITY.md",
  "/docs/I1_QUALIFICATION.md",
  "/docs/I2_QUALIFICATION.md",
  "/docs/I2_HOSTED_QUALIFICATION_PROPOSAL.md",
  "/docs/I2_PYTHON_INTEROPERABILITY.md",
  "/docs/I2_MIGRATION.md",
  "/docs/releases/0.6.0/**",
  "/docs/releases/0.7.0/**",
  "/docs/S3_MIGRATION.md",
  "/docs/S3_SCIENTIFIC_BENCHMARKS.md",
  "/docs/S3_MATHEMATICAL_QUALIFICATION.md",
  "/docs/S3_RELEASE_PREPARATION.md",
  "/docs/s3-results/**",
  "/integrations/srbench/**",
  "/examples/python/**",
]
sdist.exclude = [
  "/out/**",
  "/docs/i2-results/**",
  "/.pytest_cache/**",
  "/Testing/**",
  "**/__pycache__/**",
]

[project.optional-dependencies]
test = ["pytest==8.3.5", "pandas==2.2.3"]
