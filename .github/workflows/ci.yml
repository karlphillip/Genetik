name: C++ contracts and installed package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  qualify:
    # D5 initial complete ASan invocation:4111s, including a600s dimensional timeout.
    # The unchanged dimensional fixture passed in889s; preserve its full workload.
    # Allow the complete instrumented suite plus compilation and artifact capture.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc13-x64-minimum
            runner: ubuntu-24.04
            arch: x86_64
            cc: gcc-13
            cxx: g++-13
            build_type: Release
            sanitizers: 'OFF'
            minimum: true
          - name: clang18-x64-sanitizers
            runner: ubuntu-24.04
            arch: x86_64
            cc: clang-18
            cxx: clang++-18
            build_type: Debug
            sanitizers: 'ON'
            minimum: false
          - name: gcc13-arm64
            runner: ubuntu-24.04-arm
            arch: aarch64
            cc: gcc-13
            cxx: g++-13
            build_type: Release
            sanitizers: 'OFF'
            minimum: false
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      # Official tag refs verified during authoring; update pins deliberately.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Select the declared minimum CMake
        if: matrix.minimum
        run: |
          "$CXX" --version
          curl -fsSL --retry 2 https://cmake.org/files/v3.16/cmake-3.16.0.tar.gz -o "$RUNNER_TEMP/cmake-3.16.0.tar.gz"
          printf '%s  %s\n' '6da56556c63cab6e9a3e1656e8763ed4a841ac9859fefb63cbe79472e67e8c5f' "$RUNNER_TEMP/cmake-3.16.0.tar.gz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/cmake-3.16.0.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/cmake-min-build"
          cd "$RUNNER_TEMP/cmake-min-build"
          "$RUNNER_TEMP/cmake-3.16.0/bootstrap" --prefix="$RUNNER_TEMP/cmake-min" --parallel=2 -- -DCMAKE_USE_OPENSSL=OFF -DBUILD_TESTING=OFF
          make -j2
          make install
          echo "$RUNNER_TEMP/cmake-min/bin" >> "$GITHUB_PATH"
      - name: Record qualified environment and verify compiler choice
        run: python3 scripts/ci_command.py --log out/build/ci/environment.log --title "Qualified environment" --report -- bash scripts/ci_environment.sh '${{ matrix.arch }}' '${{ matrix.minimum }}'
      - name: Configure
        run: >-
          cmake -S . -B out/build/ci -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DGENETIK_WARNINGS_AS_ERRORS=ON -DGENETIK_SANITIZERS=${{ matrix.sanitizers }}
          -DGENETIK_RECORDED_REFERENCE=OFF -DBUILD_TESTING=ON
          -DGENETIK_BUILD_TESTS=ON -DGENETIK_BUILD_EXAMPLES=ON
          -DGENETIK_THREAD_SANITIZER=OFF
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Compile contracts, standalone headers, and quickstarts
        run: python3 scripts/ci_command.py --log out/build/ci/compile.log --title "Compilation diagnostics" -- cmake --build out/build/ci -j2
      - name: Verify the portable test manifest
        run: |
          cmake -E chdir out/build/ci ctest --show-only=json-v1 > out/build/ci/test-manifest.json
          python3 scripts/check_ci_manifest.py out/build/ci/test-manifest.json
      - name: Run bounded contracts, installed relocation, and public workflows
        # -E chdir works with CTest 3.16, which predates --test-dir.
        run: python3 scripts/ci_command.py --log out/build/ci/contracts.log --title "Portable contracts" --report -- cmake -E chdir out/build/ci ctest --output-on-failure
      - name: Separate ThreadSanitizer concurrency qualification
        if: matrix.name == 'gcc13-arm64'
        run: |
          cmake -S . -B out/build/tsan -DCMAKE_BUILD_TYPE=Debug -DGENETIK_THREAD_SANITIZER=ON -DGENETIK_SANITIZERS=OFF -DBUILD_TESTING=ON -DGENETIK_BUILD_TESTS=ON -DGENETIK_BUILD_EXAMPLES=OFF -DGENETIK_RECORDED_REFERENCE=OFF -DGENETIK_WARNINGS_AS_ERRORS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          python3 scripts/ci_command.py --log out/build/tsan/compile.log --title "TSan compilation" -- cmake --build out/build/tsan --target genetik_checkpoint_v03_writer genetik_checkpoint_compatibility_tests genetik_discrete_tests genetik_discrete_iteration_tests genetik_discrete_prime_tests genetik_checkpoint_tests genetik_prime_exact_tests genetik_concurrency_tests genetik_oop_consumer genetik_typed_tests genetik_typed_regression_tests genetik_scientific_tests genetik_parsing_tests genetik_template_tests genetik_derivative_tests genetik_derivative_regression_tests genetik_integral_tests genetik_d5_iteration_tests genetik_d5_integer_tests genetik_d5_recurrence_tests genetik_d5_scientific_tests genetik_d5_symbolic_tests genetik_d5_dimension_tests genetik_d6_tests -j2
          cmake -E chdir out/build/tsan ctest -R 'genetik_d6_overlap|genetik_d5_iteration_overlap|genetik_d5_recurrence_overlap|genetik_d5_scientific_overlap|genetik_d5_symbolic_overlap|genetik_d5_dimension_overlap|genetik_discrete_overlap|genetik_discrete_iteration_overlap|genetik_discrete_prime_overlap|genetik_concurrency_contracts|genetik_oop_parallel|genetik_typed_overlap|genetik_typed_preparation_overlap|genetik_scientific_contracts|genetik_parsing_overlap|genetik_template_overlap|genetik_derivative_overlap|genetik_derivative_regression_overlap|genetik_integral_overlap|genetik_prime_exact_overlap|genetik_checkpoint_overlap' --show-only=json-v1 > out/build/tsan/test-manifest.json
          python3 scripts/check_ci_manifest.py out/build/tsan/test-manifest.json --tsan
          # This job uses runner CTest (>=3.17), not the x64-only 3.16 bootstrap.
          TSAN_OPTIONS=halt_on_error=1 python3 scripts/ci_command.py --log out/build/tsan/contracts.log --title "TSan contracts" --report -- cmake -E chdir out/build/tsan ctest -R 'genetik_d6_overlap|genetik_d5_iteration_overlap|genetik_d5_recurrence_overlap|genetik_d5_scientific_overlap|genetik_d5_symbolic_overlap|genetik_d5_dimension_overlap|genetik_discrete_overlap|genetik_discrete_iteration_overlap|genetik_discrete_prime_overlap|genetik_concurrency_contracts|genetik_oop_parallel|genetik_typed_overlap|genetik_typed_preparation_overlap|genetik_scientific_contracts|genetik_parsing_overlap|genetik_template_overlap|genetik_derivative_overlap|genetik_derivative_regression_overlap|genetik_integral_overlap|genetik_prime_exact_overlap|genetik_checkpoint_overlap' --repeat until-fail:3 --output-on-failure
          # Complete integral contracts include transactional split/failure cases
          # beyond the forced-overlap selection. Keep the established local gate.
          TSAN_OPTIONS=halt_on_error=1 python3 scripts/ci_command.py --log out/build/tsan/integral-contracts.log --title "TSan complete integral contracts" --report -- cmake -E chdir out/build/tsan ctest -R '^genetik_integral_contracts$' --output-on-failure
          # Complete discrete contracts cover lazy/scoped resource and resume paths.
          TSAN_OPTIONS=halt_on_error=1 python3 scripts/ci_command.py --log out/build/tsan/discrete-contracts.log --title "TSan complete discrete contracts" --report -- cmake -E chdir out/build/tsan ctest -R '^(genetik_discrete(_iteration|_prime)?_contracts|genetik_checkpoint_compatibility)$' --output-on-failure
          TSAN_OPTIONS=halt_on_error=1 python3 scripts/ci_command.py --log out/build/tsan/d5-complete-contracts.log --title "TSan complete D5 contracts" --report -- cmake -E chdir out/build/tsan ctest -R '^genetik_d5_(integer|iteration|recurrence|scientific|symbolic|dimension)_contracts$' --output-on-failure
          TSAN_OPTIONS=halt_on_error=1 python3 scripts/ci_command.py --log out/build/tsan/d6-complete-contracts.log --title "TSan complete D6 contracts" --report -- cmake -E chdir out/build/tsan ctest -R '^genetik_d6_(scientific_contracts|continuation)$' --output-on-failure
      - name: Stage diagnostic artifacts
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/genetik-qualification"
          for build in out/build/ci out/build/tsan; do
            if [[ -d "$build" ]]; then
              destination="$RUNNER_TEMP/genetik-qualification/$(basename "$build")"
              mkdir -p "$destination"
              cp "$build"/*.log "$build"/test-manifest.json "$build"/CMakeCache.txt "$build"/compile_commands.json "$destination/" 2>/dev/null || true
              # Retain actual link instrumentation, not just compile flags.
              for target in "$build"/CMakeFiles/*.dir "$build"/tests/CMakeFiles/*.dir; do
                if [[ -f "$target/link.txt" ]]; then
                  relative="${target#"$build/"}"
                  mkdir -p "$destination/linkage/$relative"
                  cp "$target/link.txt" "$destination/linkage/$relative/"
                fi
              done
              for executable in genetik_derivative_tests genetik_derivative_regression_tests genetik_integral_tests genetik_concurrency_tests genetik_oop_consumer genetik_discrete_tests genetik_discrete_iteration_tests genetik_discrete_prime_tests genetik_checkpoint_compatibility_tests; do
                if [[ -f "$build/tests/$executable" ]]; then
                  ldd "$build/tests/$executable" > "$destination/$executable-runtime.log"
                fi
              done
              if [[ -d "$build/Testing/Temporary" ]]; then cp -R "$build/Testing/Temporary" "$destination/"; fi
              if [[ -d "$build/tests/genetik-delivery-fixture" ]]; then
                cp "$build/tests/genetik-delivery-fixture/commands.log" "$destination/" 2>/dev/null || true
                for consumer in 'ordinary consumer build' 'relocated consumer build' 'CXX23 consumer'; do
                  fixture="$build/tests/genetik-delivery-fixture/$consumer"
                  if [[ -d "$fixture" ]]; then
                    mkdir -p "$destination/consumers/$consumer"
                    cp "$fixture/compile_commands.json" "$fixture/resolved.txt" "$destination/consumers/$consumer/" 2>/dev/null || true
                  fi
                done
              fi
            fi
          done
      - name: Retain failure diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: logs-${{ matrix.name }}
          retention-days: 14
          path: ${{ runner.temp }}/genetik-qualification
