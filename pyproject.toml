[build-system]
requires = ["scikit-build-core==0.10.7", "pybind11==2.13.6"]
build-backend = "scikit_build_core.build"

[project]
name = "genetik"
version = "0.5.0"
description = "C++20 genetic algorithms with optional symbolic-regression bindings"
readme = "README.md"
requires-python = ">=3.7"
license = { file = "LICENSE" }
authors = [{ name = "Karl Phillip Buhr" }]
dependencies = ["numpy>=1.20", "scikit-learn>=1.0", "sympy>=1.9"]

[tool.scikit-build]
minimum-version = "0.10"
wheel.packages = ["python/genetik"]
cmake.build-type = "Release"
cmake.args = [
  "-DGENETIK_BUILD_PYTHON=ON",
  "-DGENETIK_BUILD_TESTS=OFF",
  "-DGENETIK_BUILD_EXAMPLES=OFF",
  "-DGENETIK_INSTALL=OFF",
  "-DGENETIK_WARNINGS_AS_ERRORS=ON",
]
sdist.include = [
  "/CMakeLists.txt",
  "/cmake/**",
  "/genetik/**",
  "/python/**",
  "/LICENSE",
  "/README.md",
  "/docs/I1_PYTHON_INTEROPERABILITY.md",
  "/docs/I1_QUALIFICATION.md",
  "/integrations/srbench/**",
]
sdist.exclude = [
  "/out/**",
  "/.pytest_cache/**",
  "/Testing/**",
  "**/__pycache__/**",
]

[project.optional-dependencies]
test = ["pytest==8.3.5", "pandas==2.2.3"]
